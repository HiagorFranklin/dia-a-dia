# Configuração da Netlify: com este arquivo, basta importar o repositório e clicar em Deploy.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O service worker precisa ser revalidado sempre, senão o celular demora a receber versões novas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Arquivos com hash no nome (index-AbC123.js) nunca mudam: podem ficar em cache para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
